<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
  <linearGradient id="p" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
  <linearGradient id="v" x1="0" x2="1"><stop stop-color="#0891b2"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
