<rect width="1400" height="720" rx="30" fill="#f8fafc"/>
<text x="700" y="58" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#0f172a">Type-1 vs Type-2 Virtualization</text>
<text x="700" y="92" text-anchor="middle" font-family="Arial" font-size="17" fill="#64748b">Same Ubuntu workload • Same sysbench CPU benchmark • Different virtualization layers</text>

<rect x="70" y="135" width="600" height="510" rx="25" fill="white" stroke="#ddd6fe" stroke-width="3" filter="url(#s)"/>
<rect x="730" y="135" width="600" height="510" rx="25" fill="white" stroke="#a5f3fc" stroke-width="3" filter="url(#s)"/>
