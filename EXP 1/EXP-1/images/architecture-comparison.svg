<text x="370" y="483" font-size="21" font-weight="700" fill="#4c1d95">Ubuntu Virtual Machine</text>
<rect x="160" y="535" width="420" height="70" rx="15" fill="#c4b5fd"/>
<text x="370" y="578" font-size="21" font-weight="700" fill="#312e81">sysbench CPU</text>

<rect x="820" y="250" width="420" height="70" rx="15" fill="#ecfeff"/>
