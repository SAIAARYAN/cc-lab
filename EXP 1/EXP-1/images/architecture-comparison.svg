<rect x="730" y="135" width="600" height="78" rx="25" fill="url(#v)"/>
<text x="370" y="183" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">PART A • TYPE-1</text>
<text x="1030" y="183" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="white">PART B • TYPE-2</text>

<g font-family="Arial" text-anchor="middle">
<rect x="160" y="250" width="420" height="70" rx="15" fill="#eef2ff"/>
<text x="370" y="293" font-size="21" font-weight="700" fill="#312e81">Physical Hardware</text>
